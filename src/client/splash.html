<!doctype html>
<html lang="en">
  <head>
    <link rel="stylesheet" type="text/css" href="splash.css" />
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, width=device-width, height=device-height, user-scalable=0"
    />
    <title>Urubu Vegas</title>
  </head>
  <body>
    <main class="preview" aria-label="Urubu Vegas preview">
      <section class="brand">
        <div class="mascot" aria-hidden="true">
          <div class="wing wing-left"></div>
          <div class="wing wing-right"></div>
          <div class="body"></div>
          <div class="head">
            <span class="eye left"></span>
            <span class="eye right"></span>
            <span class="beak"></span>
          </div>
          <div class="bow"></div>
        </div>
        <div class="copy">
          <p class="eyebrow">ARCADE CASINO FICTION</p>
          <h1>URUBU VEGAS</h1>
          <p class="tagline">Where fortunes go to die.</p>
        </div>
      </section>
      <section class="stats" aria-label="Preview stats">
        <span>URUBUZINHO open</span>
        <span>5x3 reels</span>
        <span>Virtual credits</span>
      </section>
      <button id="start-button" type="button">ENTER URUBU VEGAS</button>
      <p class="disclaimer">Virtual credits only. No purchases, prizes or withdrawals.</p>
    </main>
    <script type="module" src="splash.ts" defer></script>
  </body>
</html>
