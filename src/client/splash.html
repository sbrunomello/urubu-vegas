<!doctype html>
<html lang="en">
  <head>
    <link rel="stylesheet" type="text/css" href="splash.css" />
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, width=device-width, height=device-height, user-scalable=0"
    />
    <title>Urubu Vegas</title>
  </head>
  <body>
    <main class="preview" aria-label="Urubu Vegas preview">
      <div class="bulbs" aria-hidden="true"></div>
      <section class="brand">
        <div class="mascot-shell" aria-hidden="true">
          <span class="mascot-glow"></span>
          <img class="mascot" src="/assets/mascots/urubu/host.png" alt="" />
        </div>
        <div class="copy">
          <p class="eyebrow">WELCOME TO</p>
          <h1>URUBU VEGAS</h1>
          <p class="tagline">Where fortunes go to die.</p>
          <div class="chips" aria-label="Game highlights">
            <span>4 GAMES</span>
            <span>FAKE CASH</span>
            <span>BAD DECISIONS</span>
          </div>
        </div>
      </section>
      <p class="ticker" aria-label="Available games">
        URUBUZINHO <b>•</b> ONCINHA 777 <b>•</b> JACARE CRASH <b>•</b> CAPIVARA ROULETTE
      </p>
      <button id="start-button" type="button">ENTER THE CASINO <span aria-hidden="true">›</span></button>
      <p class="disclaimer">Virtual credits only. No purchases, prizes or withdrawals.</p>
    </main>
    <script type="module" src="splash.ts" defer></script>
  </body>
</html>
